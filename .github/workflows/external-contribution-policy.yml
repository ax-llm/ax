name: External Contribution Policy Runner

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: external-contribution-policy-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  publish-policy-status:
    name: Publish policy status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      # pull_request_target is privileged. Check out only the current default
      # branch and never the pull request head or merge commit.
      - name: Check out trusted policy code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Evaluate contribution policy
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          POLICY_MODULE: ${{ github.workspace }}/scripts/external-contribution-policy.mjs
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const policy = await import(pathToFileURL(process.env.POLICY_MODULE).href);
            await policy.runExternalContributionPolicy({
              github,
              context,
              core,
              prNumber: process.env.PR_NUMBER,
            });
